services:
  stock-predictor:
    build: .
    image: stock-predictor
    ports:
      - "3900:3900"
    environment:
      # 予算スクリーニング用の株価スナップショットを更新する間隔(時間)。0で自動更新を止める
      REFRESH_HOURS: "24"
    # チャート用の株価は都度取得してメモリに15分キャッシュ、スナップショットは
    # コンテナ内に保存され起動時に自動更新されるため、ボリュームは無くても動く。
    # 再作成をまたいで残したい場合だけ次の行を有効にする(先に mkdir -p data が必要)。
    # volumes:
    #   - ./data:/app/data
    restart: unless-stopped
